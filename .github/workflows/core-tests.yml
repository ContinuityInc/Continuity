# Runs ContinuityCore `swift test` on Linux for every PR.
#
# Package.swift excludes BeatTracker/KeyDetector (and their tests) on Linux — those
# import Accelerate (Apple-only). Everything else (Camelot/flow, crossfade curves,
# transition plan, loudness, silence trim, YouTube/Spotify/SoundCloud parsers, …)
# runs here. BPM and key suites still need a Mac.
name: Core tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  core-tests-linux:
    runs-on: ubuntu-24.04
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4

      # Every AVFAudio node/engine call in Playback must go through the @try/@catch shim
      # (AVFAudioGuard.swift); a raw call is a latent SIGABRT. Pure grep, runs anywhere.
      - name: AVFAudio exception boundary
        run: Scripts/check-avfaudio-boundary.sh

      - name: swift test
        run: swift test --package-path Packages/ContinuityCore
